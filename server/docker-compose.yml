services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Inside the compose network the database host is "postgres", not localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-paystack}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET}
      TICKET_LINK_SECRET: ${TICKET_LINK_SECRET}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      TICK_SECRET: ${TICK_SECRET:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
      OTP_PEPPER: ${OTP_PEPPER}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
